#  - [ bash, -c, "if [ ! -f /var/lib/cloud/firstboot_done ]; then add-apt-repository universe -y && touch /var/lib/cloud/firstboot_done && apt-get update -y; fi" ]
users:
  - name: multipass
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    groups: [sudo,users,admin]
    lock_passwd: false
    plain_text_passwd: multipass
