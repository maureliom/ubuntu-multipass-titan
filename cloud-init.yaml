              CLEAN_IMPORTS+=("$ipkg|$irange")
          done

          # --- Counts ---
          num_exports=${#EXPORT_PKG_LINES[@]}
          num_imports=${#CLEAN_IMPORTS[@]}
          provides_count=$((num_exports + 3))
          requires_count=$((num_imports + 1))

          echo "Detected Exports (${#EXPORT_PKG_LINES[@]}):"
          printf '  %s\n' "${EXPORT_PKG_LINES[@]}"
          echo "Detected Imports (${#CLEAN_IMPORTS[@]}):"
          printf '  %s\n' "${CLEAN_IMPORTS[@]}"   
          #echo "Detected Exports ($num_exports), Imports ($num_imports) for $name"

          # --- Generate <unit> XML ---
          {
          echo -e "  <unit id='$name' version='$version' singleton='false' generation='2'>"
          echo "    <update id='$name' range='[0.0.0,$version)' severity='0'/>"
          echo "    <properties size='6'>"
          echo "      <property name='df_LT.bundleVendor' value='$vendor'/>"
          echo "      <property name='df_LT.bundleName' value='$bundle_name'/>"
          echo "      <property name='org.eclipse.equinox.p2.name' value='%bundleName'/>"
          echo "      <property name='org.eclipse.equinox.p2.description' value='$description'/>"
          echo "      <property name='org.eclipse.equinox.p2.provider' value='%bundleVendor'/>"
          echo "      <property name='org.eclipse.equinox.p2.doc.url' value='$doc_url'/>"
          echo "    </properties>"
          echo "    <provides size='$provides_count'>"
          echo "      <provided namespace='org.eclipse.equinox.p2.iu' name='$name' version='$version'/>"
          echo "      <provided namespace='osgi.bundle' name='$name' version='$version'/>"
