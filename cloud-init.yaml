    owner: root:root
    permissions: '0644'
    defer: true
    content: |
        # OpenJDK 11
        #export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
        #export PATH=$JAVA_HOME/bin:$PATH
        # OpenJDK 21
        #export JAVA_HOME=/usr/lib/jvm/java-21-temurin-amd64
