          # --- Allowed packages list ---
          ALLOWED_IMPORTS=(
              "org.apache.commons.codec.digest"
          )

          # --- Imported packages ---
          declare -A seen_imports
          CLEAN_IMPORTS=()
          for p in "${import_items[@]}"; do
              p_trim=$(echo "$p" | sed 's/^[ \t]*//; s/[ \t]*$//')
