  - path: /home/multipass/.config/autostart/desktop-tweaks.sh
    permissions: '0777'
    defer: true
    owner: multipass:multipass
    content: |
      #!/bin/bash
      # Safely apply desktop tweaks

      # GNOME settings
      gsettings set org.gnome.desktop.session idle-delay 0 || true
      gsettings set org.gnome.desktop.lockdown disable-lock-screen true || true
      gsettings set org.gnome.desktop.screensaver lock-enabled false || true
      gsettings set org.gnome.settings-daemon.plugins.power sleep-inactive-ac-type 'nothing' || true
      gsettings set org.gnome.settings-daemon.plugins.power sleep-inactive-battery-type 'nothing' || true

      # Suppress nm-applet notifications (if running)
      gsettings set org.gnome.nm-applet suppress-wireless-networks-available true || true
      gsettings set org.gnome.nm-applet disable-connected-notifications true || true
      gsettings set org.gnome.nm-applet disable-disconnected-notifications true || true
      dconf write /org/gnome/nm-applet/suppress-wireless-networks-available true
      dconf write /org/gnome/nm-applet/disable-connected-notifications true
      dconf write /org/gnome/nm-applet/disable-disconnected-notifications true      

      # Optional tweaks, only if schema exists
      if gsettings list-schemas | grep -q org.gnome.shell.extensions.dash-to-panel; then
          gsettings set org.gnome.shell.extensions.dash-to-panel show-suspend-button false || true
      fi

      # If key exists (deprecated in modern GNOME)
      if gsettings list-keys org.gnome.shell 2>/dev/null | grep -q disable-log-out; then
          gsettings set org.gnome.shell disable-log-out true || true
      fi

      # Trust desktop icons (if they exist)
      [ -f ~/Desktop/eclipse.desktop ] && gio set ~/Desktop/eclipse.desktop metadata::trusted true || true
      [ -f ~/Desktop/code.desktop ] && gio set ~/Desktop/code.desktop metadata::trusted true || true

      # Turn off screen blanking via X
      xset s off
      #xset -dpms
      xset s noblank
      sudo update-desktop-database
