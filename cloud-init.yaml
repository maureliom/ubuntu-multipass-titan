          echo "          <property name='type' value='osgi.bundle'/>"
          echo "        </properties>"
          echo "      </provided>"
          echo "      <provided namespace='org.eclipse.equinox.p2.eclipse.type' name='bundle' version='1.0.0'/>"
          echo "      <provided namespace='org.eclipse.equinox.p2.localization' name='df_LT' version='1.0.0'/>"
          echo "    </provides>"
          echo "    <requires size='$requires_count'>"
          for entry in "${CLEAN_IMPORTS[@]}"; do
              IFS='|' read -r ipkg irange optional greedy <<< "$entry"
              if [[ -n "$optional" ]]; then
                  echo "      <required namespace='java.package' name='$ipkg' range='$irange' optional='$optional' greedy='$greedy'/>"
              else
                  echo "      <required namespace='java.package' name='$ipkg' range='$irange'/>"
              fi
          done
          echo "      <requiredProperties namespace='osgi.ee' match='(&amp;(osgi.ee=JavaSE)(version=1.8))'>"
          echo "        <description>$name</description>"
          echo "      </requiredProperties>"
          echo "    </requires>"
          echo "    <artifacts size='1'>"
          echo "      <artifact classifier='osgi.bundle' id='$name' version='$version'/>"
          echo "    </artifacts>"
          echo "    <touchpoint id='org.eclipse.equinox.p2.osgi' version='1.0.0'/>"
          echo "    <touchpointData size='1'>"
          echo "      <instructions size='1'>"
          echo "        <instruction key='manifest'>Bundle-SymbolicName: $name&#xA;Bundle-Version: $version&#xA;</instruction>"
          echo "      </instructions>"
          echo "    </touchpointData>"
          echo "  </unit>"
          } >> "$TMP_UNIT"
      done


      # 1ï¸âƒ£ Count units
      unit_count_new=$(grep -c '<unit ' "$TMP_UNIT")        # new units
      unit_count_orig=$(grep -c '<unit ' "$CONTENT_XML")    # existing units
      unit_count_total=$((unit_count_orig + unit_count_new))

      # 2ï¸âƒ£ Append TMP_UNIT before closing </units> with a tab for indentation
      if grep -q '</units>' "$CONTENT_XML"; then
        # create a temp file with indented units
        TMP_UNIT_INDENT=$(mktemp)
        sed 's/^/\t/' "$TMP_UNIT" > "$TMP_UNIT_INDENT"

        # insert indented units before </units>
        sed -i "/<\/units>/e cat $TMP_UNIT_INDENT" "$CONTENT_XML"

        rm -f "$TMP_UNIT_INDENT"
      else
        # fallback: append at the end
        sed -i -e "\$r $TMP_UNIT" "$CONTENT_XML"
      fi
      # 3ï¸âƒ£ Update <units size=""> attribute (handles single or double quotes)
      if grep -q '<units ' "$CONTENT_XML"; then
        sed -i -E "s/(<units[^>]*size=)['\"][0-9]+['\"]/\\1'${unit_count_total}'/" "$CONTENT_XML"
        echo "?? Updated <units size=\"$unit_count_total\">"
      else
        echo "?? No <units> tag found â€” skipped size update."
      fi

      # 4ï¸âƒ£ Cleanup
      rm -f "$TMP_UNIT"
      echo "?? content.xml updated with GUAVA unit(s)."
  - path: /opt/titan_designer/scripts/antlr_content.sh
    owner: multipass:multipass
    permissions: '0777'
    defer: true
    content: |     
      #!/usr/bin/env bash
      set -Eeuo pipefail
      trap 'echo "? Error at line $LINENO"' ERR

      BUNDLES_DIR="${1:-/opt/titan_designer/scripts/bundled}"
      CONTENT_XML="${2:-/opt/titan_designer/scripts/content_bundled/content.xml}"
      TMP_UNIT=$(mktemp)

      for jar in "$BUNDLES_DIR"/org.antlr.runtime*.jar; do
          [[ ! -f "$jar" ]] && continue
          manifest=$(unzip -p "$jar" META-INF/MANIFEST.MF 2>/dev/null | tr -d '\r' || true)
          [[ -z "$manifest" ]] && { echo "? No manifest in $(basename "$jar"), skipping."; continue; }

          # --- Bundle metadata ---
          #name=$(echo "$manifest" | grep -m1 "^Bundle-SymbolicName" | sed 's/.*: *//; s/;.*//')
          #version=$(echo "$manifest" | grep -m1 "^Bundle-Version" | sed 's/.*: *//')
          version=$(echo "$manifest" | grep -m1 "^Bundle-Version"   | sed 's/.*: *//; s/\r//' || true)
          name=$(echo "$manifest" | grep -m1 "^Bundle-SymbolicName" | sed 's/.*: *//; s/;.*//; s/\r//' || true)
          # Try to read vendor and name directly from manifest (can contain %bundleVendor etc.)
          vendor=$(echo "$manifest" | grep -m1 "^Bundle-Vendor" | sed 's/.*: *//; s/;.*//; s/\r//' || true)
          bundle_name=$(echo "$manifest" | grep -m1 "^Bundle-Name" | sed 's/.*: *//; s/;.*//; s/\r//' || true)

          # Default fallbacks if placeholders or missing
          [[ -z "$vendor" || "$vendor" == "%bundleVendor" ]] && vendor="%bundleVendor"
          [[ -z "$bundle_name" || "$bundle_name" == "%bundleName" ]] && bundle_name="%bundleName"

              # Optional fields
          description=$(awk '
          BEGIN { desc = "" ; found = 0 }
          /^Bundle-Description:/ {
              found = 1
              sub(/^Bundle-Description:[ \t]*/, "")
              desc = $0
              next
          }
          found && /^[ \t]/ {
              sub(/^[ \t]+/, "")
              desc = desc $0
              next
          }
          found && /^[A-Za-z0-9\-]+:/ { found = 0 }
          END { print desc }
          ' <<<"$manifest" | tr -d '\r' | tr '\n' ' ')

          [[ -z "$description" ]] && description="The ANTLR 4 Runtime"

          doc_url=$(echo "$manifest" | awk '/^Bundle-DocURL:/,/^[A-Za-z\-]+:/' | sed '1s/.*: *//; $d' | tr -d '\r' | tr '\n' ' ')
          doc_url=$(echo "$doc_url" | xargs)  # trim whitespace
          [[ -z "$doc_url" ]] && doc_url="http://www.antlr.org"

          # --- Exported packages (safe split, handles quoted commas) ---
          # --- Parse Export-Package safely, ignoring 'uses:' commas ---
          # export_clean is the raw Export-Package line from manifest
          # Remove uses= completely
          # --- Exported packages (ignore uses:, handle version per package) ---
          CLEAN_EXPORTS=()
          declare -A seen_exports

          # Extract Export-Package line (handle multiline)
          export_clean=$(echo "$manifest" | awk '
              BEGIN {collect=0}
              /^Export-Package:/ {collect=1; sub(/^Export-Package:[ \t]*/, ""); line=$0; next}
              collect && /^[ \t]/ {sub(/^[ \t]+/, ""); line=line $0; next}
              collect && /^[A-Za-z0-9\-]+:/ {collect=0}
              END {print line}
          ' | tr -d '\r' | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')

          # Remove all uses:= parameters
          export_clean=$(echo "$export_clean" | sed -E 's/;[[:space:]]*uses:="[^"]*"//g')

          # Split packages by commas outside quotes
          IFS=',' read -ra packages <<< "$export_clean"

          for pkg_entry in "${packages[@]}"; do
              # Trim spaces
              pkg_entry="${pkg_entry#"${pkg_entry%%[![:space:]]*}"}"
              pkg_entry="${pkg_entry%"${pkg_entry##*[![:space:]]}"}"
              [[ -z "$pkg_entry" ]] && continue

              # Package name is before first semicolon
              pkg_name="${pkg_entry%%;*}"
              pkg_name="${pkg_name#"${pkg_name%%[![:space:]]*}"}"
              pkg_name="${pkg_name%"${pkg_name##*[![:space:]]}"}"
              [[ -z "$pkg_name" ]] && continue

              # Version if exists, else fallback to bundle version
              pkg_version=$(echo "$pkg_entry" | grep -o 'version="[0-9A-Za-z\.\-]*"' || true)
              pkg_version=${pkg_version#version=\"}; pkg_version=${pkg_version%\"}
              [[ -z "$pkg_version" ]] && pkg_version="$version"

              # Avoid duplicates
              [[ -n "${seen_exports[$pkg_name]:-}" ]] && continue
              seen_exports[$pkg_name]=1

              CLEAN_EXPORTS+=("$pkg_name|$pkg_version")
          done



          # --- Extract and normalize Import-Package ---
          import_clean=$(echo "$manifest" | awk '
          BEGIN {collect=0}
          /^Import-Package:/ {collect=1; sub(/^Import-Package:[ \t]*/, ""); line=$0; next}
          collect && /^[ \t]/ {sub(/^[ \t]+/, ""); line=line $0; next}
          collect && /^[A-Za-z0-9\-]+:/ {collect=0}
          END {print line}
          ' | tr -d '\r')
          
          # --- Extract and normalize Import-Package ---
          import_clean=$(echo "$manifest" | awk '
          BEGIN {collect=0}
          /^Import-Package:/ {collect=1; sub(/^Import-Package:[ \t]*/, ""); line=$0; next}
          collect && /^[ \t]/ {sub(/^[ \t]+/, ""); line=line $0; next}
          collect && /^[A-Za-z0-9\-]+:/ {collect=0}
          END {print line}
          ' | tr -d '\r')

          # --- Properly join continuation lines and flatten ---
          import_clean=$(echo "$import_clean" | awk '
              BEGIN {ORS=""; first=1}
              /^[ \t]/ {sub(/^[ \t]+/, ""); printf "%s", $0; next}
              { if (!first) printf "\n"; first=0; printf "%s", $0 }
          ')
          import_clean=$(echo "$import_clean" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')

          mapfile -t import_items < <(echo "$import_clean" | \
              awk -v RS=',' '
              {
                  count += gsub(/"/, "\"")
                  buf = buf $0
                  if (count % 2 == 0) {
                  print buf
                  buf = ""
                  } else {
                  buf = buf ","
                  }
              }
              ')
          declare -A seen_imports=()
          declare -a CLEAN_IMPORTS=()
          for p in "${import_items[@]}"; do
              # Trim whitespace
              p_trim=$(echo "$p" | sed 's/^[ \t]*//; s/[ \t]*$//')
              [[ -z "$p_trim" ]] && continue

              # Skip malformed entries
              if [[ ! "$p_trim" =~ ^[a-zA-Z0-9_.]+ ]]; then
                  continue
              fi

              # Extract package name and version
              ipkg=$(echo "$p_trim" | sed 's/;.*//')
              version_match=$(echo "$p_trim" | grep -o 'version="[^\"]*"') || true
              if [[ -n "$version_match" ]]; then
                  irange=${version_match#version=\"}
                  irange=${irange%\"}
              else
                  irange="0.0.0"
              fi


              # Determine optional/greedy only if resolution:=optional exists
              if [[ "$p_trim" =~ resolution:=optional ]]; then
                  optional="true"
                  greedy="false"
              else
                  optional=""
                  greedy=""
              fi

              # Deduplicate
              if [[ -z "${seen_imports[$ipkg]:-}" ]]; then
                  seen_imports[$ipkg]=1
                  CLEAN_IMPORTS+=("$ipkg|$irange|$optional|$greedy")
              fi
          done


          # --- Generate <unit> XML ---
          num_exports=${#CLEAN_EXPORTS[@]}
          num_imports=${#CLEAN_IMPORTS[@]}
          provides_count=$((num_exports + 5))
          requires_count=$((num_imports + 1))

          {
          echo -e "  <unit id='$name' version='$version' singleton='false' generation='2'>"
          echo "    <update id='$name' range='[0.0.0,$version)' severity='0'/>"
          echo "    <properties size='6'>"
          echo "      <property name='df_LT.bundleVendor' value='$vendor'/>"
          echo "      <property name='df_LT.bundleName' value='$bundle_name'/>"
          echo "      <property name='org.eclipse.equinox.p2.name' value='%bundleName'/>"
          echo "      <property name='org.eclipse.equinox.p2.description' value=\"$description\"/>"
          echo "      <property name='org.eclipse.equinox.p2.provider' value='%bundleVendor'/>"
          echo "      <property name='org.eclipse.equinox.p2.doc.url' value='$doc_url'/>"
          echo "    </properties>"
          echo "    <provides size='$provides_count'>"
          echo "      <provided namespace='org.eclipse.equinox.p2.iu' name='$name' version='$version'/>"
          echo "      <provided namespace='osgi.bundle' name='$name' version='$version'/>"
          for entry in "${CLEAN_EXPORTS[@]}"; do
              pkg=${entry%%|*}; pv=${entry#*|} 
              echo "      <provided namespace='java.package' name='$pkg' version='$pv'/>"
          done
          echo "      <provided namespace='osgi.identity' name='$name' version='$version'>"
          echo "        <properties size='1'>"
          echo "          <property name='type' value='osgi.bundle'/>"
          echo "        </properties>"
          echo "      </provided>"
          echo "      <provided namespace='org.eclipse.equinox.p2.eclipse.type' name='bundle' version='1.0.0'/>"
          echo "      <provided namespace='org.eclipse.equinox.p2.localization' name='df_LT' version='1.0.0'/>"
          echo "    </provides>"
          echo "    <requires size='$requires_count'>"
          for entry in "${CLEAN_IMPORTS[@]}"; do
              IFS='|' read -r ipkg irange optional greedy <<< "$entry"
              if [[ -n "$optional" ]]; then
                  echo "      <required namespace='java.package' name='$ipkg' range='$irange' optional='$optional' greedy='$greedy'/>"
              else
                  echo "      <required namespace='java.package' name='$ipkg' range='$irange'/>"
              fi
          done
          echo "      <requiredProperties namespace='osgi.ee' match='(&amp;(osgi.ee=JavaSE)(version=1.8))'>"
          echo "        <description>$name</description>"
          echo "      </requiredProperties>"
          echo "    </requires>"
          echo "    <artifacts size='1'>"
          echo "      <artifact classifier='osgi.bundle' id='$name' version='$version'/>"
          echo "    </artifacts>"
          echo "    <touchpoint id='org.eclipse.equinox.p2.osgi' version='1.0.0'/>"
          echo "    <touchpointData size='1'>"
          echo "      <instructions size='1'>"
          echo "        <instruction key='manifest'>Bundle-SymbolicName: $name&#xA;Bundle-Version: $version&#xA;</instruction>"
          echo "      </instructions>"
          echo "    </touchpointData>"
          echo "  </unit>"
          } >> "$TMP_UNIT"
      done


      # 1ï¸âƒ£ Count units
      unit_count_new=$(grep -c '<unit ' "$TMP_UNIT")        # new units
      unit_count_orig=$(grep -c '<unit ' "$CONTENT_XML")    # existing units
      unit_count_total=$((unit_count_orig + unit_count_new))

      # 2ï¸âƒ£ Append TMP_UNIT before closing </units> with a tab for indentation
      if grep -q '</units>' "$CONTENT_XML"; then
        # create a temp file with indented units
        TMP_UNIT_INDENT=$(mktemp)
        sed 's/^/\t/' "$TMP_UNIT" > "$TMP_UNIT_INDENT"

        # insert indented units before </units>
        sed -i "/<\/units>/e cat $TMP_UNIT_INDENT" "$CONTENT_XML"

        rm -f "$TMP_UNIT_INDENT"
      else
        # fallback: append at the end
        sed -i -e "\$r $TMP_UNIT" "$CONTENT_XML"
      fi
      # 3ï¸âƒ£ Update <units size=""> attribute (handles single or double quotes)
      if grep -q '<units ' "$CONTENT_XML"; then
        sed -i -E "s/(<units[^>]*size=)['\"][0-9]+['\"]/\\1'${unit_count_total}'/" "$CONTENT_XML"
        echo "?? Updated <units size=\"$unit_count_total\">"
      else
        echo "?? No <units> tag found â€” skipped size update."
      fi

      # 4ï¸âƒ£ Cleanup
      rm -f "$TMP_UNIT"
      echo "?? content.xml updated with ANTLR unit(s)."
  - path: /opt/titan_designer/scripts/deploy_titan.sh
    owner: multipass:multipass
    permissions: '0777'
    defer: true
    content: |     
      #!/usr/bin/env bash
      set -Eeuo pipefail
      trap 'echo "? Error at line $LINENO"; exit 1' ERR

      # ---------------------------------------
      # Configuration
      # ---------------------------------------
      ZIP_DIR="/opt/titan_designer/result/plugin"
      DEST="/opt/eclipse-ide/eclipse/dropins/titan"
      TMP="/tmp/titan_build"
      MVN_BIN="/opt/apache-maven-3.9.11/bin/mvn"
      SCRIPTS_DIR="/opt/titan_designer/scripts"
      BUNDLED_DIR="${SCRIPTS_DIR}/bundled"
      DESIGNER_JARS="/opt/titan_designer/jars/run"

      # ---------------------------------------
      # Find latest TITAN build zip
      # ---------------------------------------
      ZIP_FILE=$(ls -t "${ZIP_DIR}"/TITAN_on_Eclipse_*.zip 2>/dev/null | head -n1) || true
      if [[ -z "${ZIP_FILE:-}" ]]; then
        echo "? No TITAN_on_Eclipse_*.zip found in ${ZIP_DIR}"
        exit 1
      fi

      echo "?? Using build: ${ZIP_FILE}"

      # ---------------------------------------
      # Prepare temp workspace
      # ---------------------------------------
      rm -rf "${TMP}"
      mkdir -p "${TMP}"
      unzip -q "${ZIP_FILE}" -d "${TMP}"
      echo "?? Unzipped build to: ${TMP}"

      # Extract existing metadata for merging
      unzip -q "${TMP}/artifacts.jar" -d "${TMP}"
      unzip -q "${TMP}/content.jar" -d "${TMP}"

      # ---------------------------------------
      # Build updated dependency bundles
      # ---------------------------------------
      echo "??  Building Maven bundles..."
      cd "${SCRIPTS_DIR}"
      "${MVN_BIN}" clean install
      "${MVN_BIN}" -o clean package

      # Copy newly built jars to bundled dir
      cp "${SCRIPTS_DIR}/apache-poi-bundle/target/org.apache.poi-11.1.0.jar" "${BUNDLED_DIR}/org.apache.poi_11.1.0.jar"
      cp "${SCRIPTS_DIR}/eclipse-collections-bundle/target/org.eclipse.collections-11.1.0.jar" "${BUNDLED_DIR}/org.eclipse.collections_11.1.0.jar"
      cp "${SCRIPTS_DIR}/jung-bundle/target/edu.uci.ics.jung-11.1.0.jar" "${BUNDLED_DIR}/edu.uci.ics.jung_11.1.0.jar"
      cp "${DESIGNER_JARS}/org.antlr.runtime_4.7.1.v20181120-0808.jar" "${BUNDLED_DIR}/org.antlr.runtime_4.7.1.v20181120-0808.jar"
      cp "${DESIGNER_JARS}/com.google.guava_21.0.0.v20170206-1425.jar" "${BUNDLED_DIR}/com.google.guava_21.0.0.v20170206-1425.jar"

      echo "? Bundled jars updated."

      # ---------------------------------------
      # Update content.xml
      # ---------------------------------------
      echo "?? Updating content.xml metadata..."
      "${SCRIPTS_DIR}/eclipse_collections_content.sh" "${BUNDLED_DIR}" "${TMP}/content.xml"
      "${SCRIPTS_DIR}/apache_poi_content.sh" "${BUNDLED_DIR}" "${TMP}/content.xml"
      "${SCRIPTS_DIR}/jung_content.sh" "${BUNDLED_DIR}" "${TMP}/content.xml"
      "${SCRIPTS_DIR}/guava_content.sh" "${BUNDLED_DIR}" "${TMP}/content.xml"
      "${SCRIPTS_DIR}/antlr_content.sh" "${BUNDLED_DIR}" "${TMP}/content.xml"

      # ---------------------------------------
      # Update artifacts.xml
      # ---------------------------------------
      echo "?? Appending artifacts metadata..."
      "${SCRIPTS_DIR}/artifacts.sh" "${BUNDLED_DIR}" "${TMP}/artifacts.xml"

      # Copy bundled jars into extracted plugin
      cp "${BUNDLED_DIR}"/*.jar "${TMP}/plugins/" 2>/dev/null || true

      # ---------------------------------------
      # Repack & Deploy
      # ---------------------------------------
      cd "${TMP}"
      echo "?? Repacking updated plugin..."
      zip -qr "${TMP}/artifacts.jar" artifacts.xml
      zip -qr "${TMP}/content.jar" content.xml
      zip -qr TITAN_complete.zip . >/dev/null
      mv TITAN_complete.zip "${ZIP_DIR}/TITAN_complete_$(date +%Y%m%d).zip"

      echo "?? Installing to Eclipse dropins..."
      unzip -qo "${ZIP_DIR}/TITAN_complete_$(date +%Y%m%d).zip" -d "${DEST}"

      echo "? TITAN plugin successfully enriched and installed to dropins."
runcmd:
