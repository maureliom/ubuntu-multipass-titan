# ====================================================================================================================================================
#                          NETWORK
# ====================================================================================================================================================
  - [ sh, -c, "netplan apply" ]
# ====================================================================================================================================================
#                          X11 / XRDP
# ====================================================================================================================================================
  - [ sh, -c, "chmod +x /etc/xrdp/startwm.sh" ]
  - [ sh, -c, "touch /home/multipass/.Xauthority" ]  
  - [ sh, -c, "chown multipass:multipass /home/multipass/.Xauthority" ]
  - [ sh, -c, "chmod +x /home/multipass/.Xauthority" ]  
  - [ sh, -c, "chown root:root /etc/systemd/system/xrdp-rdc.service" ]
  - [ sh, -c, "chmod 644 /etc/systemd/system/xrdp-rdc.service" ]
  - [ sh, -c, "rm -f /etc/xrdp/key.pem /etc/xrdp/cert.pem" ]
  - [ sh, -c, "openssl genrsa -out /etc/xrdp/key.pem 2048" ]
  - [ sh, -c, "openssl req -x509 -new -nodes -key /etc/xrdp/key.pem -sha256 -days 3650 -out /etc/xrdp/cert.pem -subj '/C=US/ST=None/L=None/O=XRDP/CN=localhost'" ]
  - [ sh, -c, "chown xrdp:xrdp /etc/xrdp/key.pem /etc/xrdp/cert.pem" ]
  - [ sh, -c, "chmod 600 /etc/xrdp/key.pem /etc/xrdp/cert.pem" ]
  - [ sh, -c, "systemctl disable lightdm" ]      
  - [ sh, -c, "systemctl enable gdm3" ]    
  - [ sh, -c, "systemctl enable xrdp-rdc.service" ]    
  - [ sh, -c, "systemctl enable xrdp.service" ]  
  - [ sh, -c, "systemctl daemon-reexec" ]
  - [ sh, -c, "systemctl daemon-reload" ]
  - [ sh, -c, "systemctl start gdm3 xrdp xrdp-rdc xrdp-sesman" ]
  - [ sh, -c, "systemctl set-default graphical.target" ]      
  - [ sh, -c, "xhost +SI:localuser:root" ]
  - [ sh, -c, "convert /usr/share/backgrounds/warty-final-ubuntu.png -resize 1920x1080! -gravity center -extent 1920x1080 -type TrueColor -depth 24 /usr/share/xrdp/warty-final-ubuntu.bmp" ]                  
  - [ sh, -c, "convert -size 1x1 xc:none -define bmp:format=bmp3 /usr/share/xrdp/transparent.bmp" ]            
