# ====================================================================================================================================================
#                           CHANGE SESSION XFCE4 / GNOME
#                       !!!! OR X11 OR XRDP (NOT BOTH) !!!!
#                           (see /etc/gdm3/custom.conf)
# {USER_INPUT} I.Ex.: THE SECTION BELOW CHANGES XFCE4 / GNOME EVEN AFTER PROVISIONING       
# ====================================================================================================================================================
  - path: /etc/xrdp/startwm.sh
    owner: root:root
    permissions: '0777'
    defer: true
    content: |           
      #!/bin/sh
      # xrdp X session start script (c) 2015, 2017, 2021 mirabilos
      # published under The MirOS Licence
      # Rely on /etc/pam.d/xrdp-sesman using pam_env to load both
      # /etc/environment and /etc/default/locale to initialise the
      # locale and the user environment properly.
      #
      export GNOME_SHELL_SESSION_MODE=ubuntu
      export XDG_CURRENT_DESKTOP=ubuntu:GNOME
      export XDG_SESSION_TYPE=x11
      #export GDK_BACKEND=x11
      unset DBUS_SESSION_BUS_ADDRESS
      # start a dbus session
      eval $(dbus-launch --sh-syntax --exit-with-session)
      xhost +SI:localuser:root 
      setxkbmap pt
      . /etc/default/locale
      export LANG LC_ALL LANGUAGE
      # ==============================================================================================================================================
      #                        LAUNCH XFCE4
      #startxfce4
      #===============================================================================================================================================
      #                        LAUNCH GNOME
      exec gnome-session --session=ubuntu
      /home/multipass/.config/autostart/desktop-tweaks.sh
      # ==============================================================================================================================================
      if test -r /etc/profile; then
          . /etc/profile
      fi
      if test -r ~/.profile; then
          . ~/.profile
      fi
      # start GNOME (path may vary)
      #if [ -x /usr/libexec/gnome-session-binary ]; then
      #  exec /usr/libexec/gnome-session-binary --systemd --session=ubuntu
      #elif [ -x /usr/lib/gnome-session/gnome-session-binary ]; then
      #  exec /usr/lib/gnome-session/gnome-session-binary --systemd --session=ubuntu
      #else
      #  exec gnome-session
      #fi
      #exec gnome-session
      #test -x /etc/X11/Xsession && exec /etc/X11/Xsession
      #exec /bin/sh /etc/X11/Xsession
      #
      #CRASH HELPERS
      #sudo pkill -u multipass gnome-session-binary
      #sudo pkill -u multipass Xorg
      #sudo rm -rf /tmp/.X10-lock /tmp/.X11-unix/X10      
