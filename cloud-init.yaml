  - path: /opt/titan_designer/scripts/artifacts.sh
    owner: multipass:multipass
    permissions: '0777'
    defer: true
    content: |  
      #!/usr/bin/env bash
      set -euo pipefail
      trap 'echo "? Error at line $LINENO"' ERR

      JAR_DIR="${1:-.}"
      TARGET_XML="${2:-artifacts.xml}"

      TMP_APPEND=$(mktemp)

      # --- Generate new artifact entries only ---
      for f in "${JAR_DIR}"/*.jar; do
        [ -f "$f" ] || continue
        fname=$(basename "$f")

        # Extract id and version robustly
        if [[ "$fname" =~ ^(.+)_([0-9]+\.[0-9]+\.[0-9]+(\.[^.]*)?)\.jar$ ]]; then
          id="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"
        else
          id="${fname%%_*}"
          version="${fname#${id}_}"
          version="${version%.jar}"
        fi

        size=$(stat -c%s "$f")
        sha256=$(sha256sum "$f" | awk '{print $1}')
        sha512=$(sha512sum "$f" | awk '{print $1}')

        cat >>"$TMP_APPEND" <<EOF
          <artifact classifier='osgi.bundle' id='${id}' version='${version}'>
            <properties size='4'>
              <property name='artifact.size' value='${size}'/>
              <property name='download.size' value='${size}'/>
              <property name='download.checksum.sha-512' value='${sha512}'/>
              <property name='download.checksum.sha-256' value='${sha256}'/>
            </properties>
          </artifact>
      EOF
      done

      # --- Merge into existing artifacts.xml ---
      if [[ -f "$TARGET_XML" ]]; then
        echo "?? Appending artifact entries to $TARGET_XML ..."
        
        # Insert before closing </artifacts>
        sed -i "/<\/artifacts>/e cat $TMP_APPEND" "$TARGET_XML"

        # --- Update <artifacts size="..."> count ---
        total=$(grep -c "<artifact " "$TARGET_XML" || true)
        if [[ $total -gt 0 ]]; then
          sed -i -E "s/(<artifacts[^>]*size=)['\"][0-9]+['\"]/\1\"$total\"/" "$TARGET_XML"
          echo "? Updated artifacts count: $total"
        else
          echo "?? Could not detect any <artifact> entries to count."
        fi

      else
        echo "?? No existing artifacts.xml found — creating a new one."
        {
          echo "<?xml version='1.0' encoding='UTF-8'?>"
          echo "<?artifactRepository version='1.1.0'?>"
          echo "<repository name='auto-generated-artifacts' type='org.eclipse.equinox.p2.artifact.repository.simpleRepository' version='1'>"
          echo "  <artifacts size='$(grep -c '<artifact ' "$TMP_APPEND")'>"
          cat "$TMP_APPEND"
          echo "  </artifacts>"
          echo "</repository>"
        } >"$TARGET_XML"
      fi

      rm -f "$TMP_APPEND"
  - path: /opt/titan_designer/scripts/eclipse_collections_content.sh
    owner: multipass:multipass
    permissions: '0777'
    defer: true
    content: |  
      #!/usr/bin/env bash
      set -Eeuo pipefail
      trap 'echo "âŒ Error at line $LINENO"' ERR


      BUNDLES_DIR="${1:-/opt/titan_designer/scripts/bundled}"
      CONTENT_XML="${2:-/opt/titan_designer/scripts/content_bundled/content.xml}"

      TMP_UNIT=$(mktemp)
      TMP_FINAL=$(mktemp)

      echo "?? Looking for Eclipse Collections bundle in: $BUNDLES_DIR"

      # helper: extract a manifest header block (header + continuation lines)
      extract_manifest_block() {
        local manifest="$1"
        local header="$2"
        echo "$manifest" | awk -v H="${header}:" '
          $0 ~ "^"H { print; inblock=1; next }
          inblock && $0 ~ "^[ \t]" { print; next }
          { inblock=0 }
        '
      }
      echo "1"
      # iterate target jars
      for jar in "$BUNDLES_DIR"/org.eclipse.collections*.jar; do
        [[ ! -f "$jar" ]] && continue

        echo "2"
        manifest=$(unzip -p "$jar" META-INF/MANIFEST.MF 2>/dev/null | tr -d '\r' | sed '1s/^\xEF\xBB\xBF//' || true)
        if [[ -z "$manifest" ]]; then
          echo "??  No manifest in $(basename "$jar"), skipping."
          continue
        fi

        echo "3"
        echo "3.1 Reading Bundle-Version..."
        #echo $manifest
        version=$(echo "$manifest" | grep -m1 "^Bundle-Version" | sed 's/.*: *//; s/\r//' || true)
        name=$(echo "$manifest" | grep -m1 "^Bundle-SymbolicName" | sed 's/.*: *//; s/;.*//; s/\r//' || true)
        if [[ -z "${version:-}" ]]; then
          echo "âš ï¸  Bundle-Version not found, defaulting to 11.1.0"
          version="11.1.0"
        else
          echo "âœ… Found version: $version"
        fi

        echo "4"
        vendor=$(echo "$manifest" | awk -F': ' '/^Bundle-Vendor/ {print $2; exit}' | tr -d '\r')
        [[ -z "$vendor" ]] && vendor="Eclipse Collections"
        echo "5"
        bundle_name="Eclipse Collections Main Library"
        description="Eclipse Collections is a collections framework for Java. It has JDK-compatible List, Set and Map implementations with a rich API and set of utility classes that work with any JDK compatible Collections, Arrays, Maps or Strings. The iteration protocol was inspired by the Smalltalk collection framework."
        doc_url="https://github.com/eclipse/eclipse-collections/eclipse-collections-api"

        # --- Extract and normalize Export-Package ---
        # --- Extract and normalize Export-Package ---
        export_clean=$(echo "$manifest" | awk '
        BEGIN {collect=0}
        /^Export-Package:/ {collect=1; sub(/^Export-Package:[ \t]*/, ""); line=$0; next}
        collect && /^[ \t]/ {sub(/^[ \t]+/, ""); line=line $0; next}
        collect && /^[A-Za-z0-9\-]+:/ {collect=0}
        END {print line}
        ' | tr -d '\r')

        # --- Extract and normalize Import-Package ---
        import_clean=$(echo "$manifest" | awk '
        BEGIN {collect=0}
        /^Import-Package:/ {collect=1; sub(/^Import-Package:[ \t]*/, ""); line=$0; next}
        collect && /^[ \t]/ {sub(/^[ \t]+/, ""); line=line $0; next}
        collect && /^[A-Za-z0-9\-]+:/ {collect=0}
        END {print line}
        ' | tr -d '\r')
        
        # --- Extract and normalize Import-Package ---
        import_clean=$(echo "$manifest" | awk '
        BEGIN {collect=0}
        /^Import-Package:/ {collect=1; sub(/^Import-Package:[ \t]*/, ""); line=$0; next}
        collect && /^[ \t]/ {sub(/^[ \t]+/, ""); line=line $0; next}
        collect && /^[A-Za-z0-9\-]+:/ {collect=0}
        END {print line}
        ' | tr -d '\r')

        # --- Properly join continuation lines and flatten ---
        import_clean=$(echo "$import_clean" | awk '
          BEGIN {ORS=""; first=1}
          /^[ \t]/ {sub(/^[ \t]+/, ""); printf "%s", $0; next}
          { if (!first) printf "\n"; first=0; printf "%s", $0 }
        ')
        import_clean=$(echo "$import_clean" | tr '\n' ' ' | sed 's/[[:space:]]\+/ /g')

        # --- Split cleanly by commas at top level ---
        IFS=',' read -r -a export_items <<< "$export_clean"
        # --- Split on commas not inside quotes ---
        mapfile -t import_items < <(echo "$import_clean" | \
          awk -v RS=',' '
            {
              count += gsub(/"/, "\"")
              buf = buf $0
              if (count % 2 == 0) {
                print buf
                buf = ""
              } else {
                buf = buf ","
              }
            }
          ')


        declare -A seen=()
        declare -a EXPORT_PKG_LINES=()
        for p in "${export_items[@]}"; do
            # Remove leading/trailing spaces
            p_trim=$(echo "$p" | sed 's/^[ \t]*//; s/[ \t]*$//')

            # Remove anything after ;uses:= or other attributes
            p_trim=$(echo "$p_trim" | sed 's/;uses:=.*//; s/;version=".*"//')

            # Remove quotes
            p_trim=${p_trim//\"/}

            # Skip empty
            [[ -z "$p_trim" ]] && continue

            # Deduplicate
            if [[ -z "${seen[$p_trim]:-}" ]]; then
                seen[$p_trim]=1
                EXPORT_PKG_LINES+=("$p_trim|$version")
            fi
        done

        declare -A seen_imports=()
        declare -a CLEAN_IMPORTS=()
        for p in "${import_items[@]}"; do
            # Trim whitespace
            p_trim=$(echo "$p" | sed 's/^[ \t]*//; s/[ \t]*$//')
            [[ -z "$p_trim" ]] && continue

            # Skip malformed entries
            if [[ ! "$p_trim" =~ ^[a-zA-Z0-9_.]+ ]]; then
                continue
            fi

            # Extract package name and version
            ipkg=$(echo "$p_trim" | sed 's/;.*//')
            version_match=$(echo "$p_trim" | grep -o 'version="[^\"]*"') || true
            if [[ -n "$version_match" ]]; then
                irange=${version_match#version=\"}
                irange=${irange%\"}
            else
                irange="0.0.0"
            fi

            # Deduplicate
            if [[ -z "${seen_imports[$ipkg]:-}" ]]; then
                seen_imports[$ipkg]=1
                CLEAN_IMPORTS+=("$ipkg|$irange")
            fi
        done



        echo "Detected Exports (${#EXPORT_PKG_LINES[@]}):"
        printf '  %s\n' "${EXPORT_PKG_LINES[@]}"
        echo "Detected Imports (${#CLEAN_IMPORTS[@]}):"
        printf '  %s\n' "${CLEAN_IMPORTS[@]}"
        echo "10"

        num_exports=${#EXPORT_PKG_LINES[@]}
        num_imports=${#CLEAN_IMPORTS[@]}
        echo "11"

        provides_count=$(( num_exports + 5 ))
        requires_count=$(( num_imports + 1 ))  
        echo "? Adding unit for $name (export pkgs: $num_exports, import pkgs: $num_imports)"
        {
          echo "  <unit id=\"$name\" version=\"$version\" singleton=\"false\" generation=\"2\">"
          echo "    <update id=\"$name\" range=\"[0.0.0,$version)\" severity=\"0\"/>"
          echo "    <properties size=\"6\">"
          echo "      <property name=\"df_LT.bundleVendor\" value=\"$vendor\"/>"
          echo "      <property name=\"df_LT.bundleName\" value=\"$bundle_name\"/>"
          echo "      <property name=\"org.eclipse.equinox.p2.name\" value=\"%bundleName\"/>"
          echo "      <property name=\"org.eclipse.equinox.p2.description\" value=\"$description\"/>"
          echo "      <property name=\"org.eclipse.equinox.p2.provider\" value=\"%bundleVendor\"/>"
          echo "      <property name=\"org.eclipse.equinox.p2.doc.url\" value=\"$doc_url\"/>"
          echo "    </properties>"
          echo "    <provides size=\"$provides_count\">"
          echo "      <provided namespace='org.eclipse.equinox.p2.iu' name='$name' version='$version'/>"
          echo "      <provided namespace='osgi.bundle' name='$name' version='$version'/>"
          for entry in "${EXPORT_PKG_LINES[@]}"; do
            pkg=${entry%%|*}
            pv=${entry#*|}
            echo "      <provided namespace='java.package' name='$pkg' version='$pv'/>"
          done
          echo "      <provided namespace='osgi.identity' name='$name' version='$version'>"
          echo "        <properties size='1'>"
          echo "          <property name='type' value='osgi.bundle'/>"
          echo "        </properties>"
          echo "      </provided>"
          echo "      <provided namespace='org.eclipse.equinox.p2.eclipse.type' name='bundle' version='1.0.0'/>"
          echo "      <provided namespace='org.eclipse.equinox.p2.localization' name='df_LT' version='1.0.0'/>"
          echo "    </provides>"
          echo "    <requires size=\"$requires_count\">"
          # Use CLEAN_IMPORTS in your loop:
          for entry in "${CLEAN_IMPORTS[@]}"; do
              ipkg=${entry%%|*}
              irange=${entry#*|}
              echo "      <required namespace='java.package' name='$ipkg' range='$irange' optional='true' greedy='false'/>"
          done
          echo "      <requiredProperties namespace='osgi.ee' match='(&amp;(osgi.ee=JavaSE)(version=11))'>"
          echo "        <description>$name</description>"
          echo "      </requiredProperties>"
          echo "    </requires>"
          echo "    <artifacts size='1'>"
          echo "      <artifact classifier='osgi.bundle' id='$name' version='$version'/>"
          echo "    </artifacts>"
          echo "    <touchpoint id='org.eclipse.equinox.p2.osgi' version='1.0.0'/>"
          echo "    <touchpointData size='1'>"
          echo "      <instructions size='1'>"
          echo "        <instruction key='manifest'>Bundle-SymbolicName: $name&#xA;Bundle-Version: $version&#xA;</instruction>"
          echo "      </instructions>"
          echo "    </touchpointData>"
          echo "  </unit>"
        } >> "$TMP_UNIT"

        unset EXPORT_PKG_LINES
        unset IMPORT_PKG_LINES
      done

      # 1ï¸âƒ£ Count units
      unit_count_new=$(grep -c '<unit ' "$TMP_UNIT")        # new units
      unit_count_orig=$(grep -c '<unit ' "$CONTENT_XML")    # existing units
      unit_count_total=$((unit_count_orig + unit_count_new))

      # 2ï¸âƒ£ Append TMP_UNIT before closing </units> with a tab for indentation
      if grep -q '</units>' "$CONTENT_XML"; then
        # create a temp file with indented units
        TMP_UNIT_INDENT=$(mktemp)
        sed 's/^/\t/' "$TMP_UNIT" > "$TMP_UNIT_INDENT"

        # insert indented units before </units>
        sed -i "/<\/units>/e cat $TMP_UNIT_INDENT" "$CONTENT_XML"

        rm -f "$TMP_UNIT_INDENT"
      else
        # fallback: append at the end
        sed -i -e "\$r $TMP_UNIT" "$CONTENT_XML"
      fi
      # 3ï¸âƒ£ Update <units size=""> attribute (handles single or double quotes)
      if grep -q '<units ' "$CONTENT_XML"; then
        sed -i -E "s/(<units[^>]*size=)['\"][0-9]+['\"]/\\1'${unit_count_total}'/" "$CONTENT_XML"
        echo "?? Updated <units size=\"$unit_count_total\">"
      else
        echo "?? No <units> tag found â€” skipped size update."
      fi

      # 4ï¸âƒ£ Cleanup
      rm -f "$TMP_UNIT"

      echo "? content.xml updated with Eclipse Collections unit(s) and refreshed <units size> count."
  - path: /opt/titan_designer/scripts/apache_poi_content.sh
    owner: multipass:multipass
    permissions: '0777'
    defer: true
    content: |  
      #!/usr/bin/env bash
      set -Eeuo pipefail
      trap 'echo "? Error at line $LINENO"' ERR

      BUNDLES_DIR="${1:-/opt/titan_designer/scripts/bundled}"
      CONTENT_XML="${2:-/opt/titan_designer/scripts/content_bundled/content.xml}"

      TMP_UNIT=$(mktemp)

      echo "?? Looking for Apache POI bundle in: $BUNDLES_DIR"

      for jar in "$BUNDLES_DIR"/org.apache.poi*.jar; do
          [[ ! -f "$jar" ]] && continue

          manifest=$(unzip -p "$jar" META-INF/MANIFEST.MF 2>/dev/null | tr -d '\r' || true)
          [[ -z "$manifest" ]] && { echo "? No manifest in $(basename "$jar"), skipping."; continue; }

          # --- Bundle metadata ---
          name=$(echo "$manifest" | grep -m1 "^Bundle-SymbolicName" | sed 's/.*: *//; s/;.*//')
          version=$(echo "$manifest" | grep -m1 "^Bundle-Version" | sed 's/.*: *//')
          vendor=$(echo "$manifest" | awk -F': ' '/^Bundle-Vendor/ {print $2; exit}')
          vendor=${vendor:-"Eclipse Orbit"}
          bundle_name="Apache POI"
          description="Apache POI provides libraries for reading and writing Microsoft Office formats in Java."
          doc_url="https://poi.apache.org/"

          # --- Exported packages ---
          export_clean=$(echo "$manifest" | awk '
              BEGIN {collect=0}
              /^Export-Package:/ {collect=1; sub(/^Export-Package:[ \t]*/, ""); line=$0; next}
              collect && /^[ \t]/ {sub(/^[ \t]+/, ""); line=line $0; next}
              collect && /^[A-Za-z0-9\-]+:/ {collect=0}
              END {print line}
          ' | tr -d '\r')

          IFS=',' read -r -a export_items <<< "$export_clean"

          declare -A seen_exports
          EXPORT_PKG_LINES=()
          for p in "${export_items[@]}"; do
              p_trim=$(echo "$p" | sed 's/^[ \t]*//; s/[ \t]*$//; s/;.*//; s/\"//g')
              [[ -z "$p_trim" ]] && continue
