        # Temurin
        export JAVA_HOME_11=/usr/lib/jvm/temurin-11-jdk-amd64
        export JAVA_HOME_21=/usr/lib/jvm/temurin-21-jdk-amd64
        export PATH=$JAVA_HOME_11/bin:$PATH   
  - path: /etc/profile.d/maven.sh
    owner: root:root
