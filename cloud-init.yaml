# ===============================================================================================================================================
#                                                  {USER_INPUT} 
#                          Enable the line below if this workstation will compile titan engine
#                                  https://gitlab.eclipse.org/eclipse/titan/titan.core
#                             https://gitlab.eclipse.org/eclipse/titan/titan.EclipsePlug-ins
