#                          ECLIPSE / TITAN DESIGNER
# ====================================================================================================================================================
  - [ sh, -c, "sudo chown -R multipass:multipass /home/multipass" ]  
  - [ sh, -c, 'wget -4 -O /home/multipass/eclipse.tar.gz "https://www.mirrorservice.org/sites/download.eclipse.org/eclipseMirror/technology/epp/downloads/release/2025-09/R/eclipse-jee-2025-09-R-linux-gtk-x86_64.tar.gz"' ]
  - [ sh, -c, 'wget -4 -O /home/multipass/TITAN.zip "https://mirror.dotsrc.org/mirrors/pub/eclipse/titan/TITAN_Designer_and_Executor_plugin-11.1.0.zip"' ]
  - [ sh, -c, "sudo tar -xf /home/multipass/eclipse.tar.gz -C /opt/" ]
  - [ sh, -c, "sudo chown -R multipass:multipass /opt/eclipse" ]
  - [ sh, -c, "sudo ln -s /opt/eclipse/eclipse /usr/local/bin/eclipse" ]
  - [ sh, -c, "sudo -u multipass bash -c 'mkdir -p /opt/eclipse/dropins/titan'" ]
  - [ sh, -c, "sudo -u multipass bash -c 'unzip -o /home/multipass/TITAN.zip -d /opt/eclipse/dropins/titan'" ]
  - [ sh, -c, "sudo -u multipass bash -c 'sudo chmod +x /home/multipass/Desktop/eclipse.desktop'" ]
  - [ sh, -c, "sudo -u multipass bash -c 'chown multipass:multipass /home/multipass/Desktop/eclipse.desktop'" ]  
  - [ sh, -c, "sudo -u multipass bash -c 'mkdir -p /home/multipass/eclipse-workspace/.metadata/.plugins/org.eclipse.core.runtime/.settings'" ]
  - [ sh, -c, "sudo -u multipass bash -c 'mkdir -p /home/multipass/eclipse-workspace/.metadata/.plugins/org.eclipse.debug.core/.launches'" ]  
  - [ sh, -c, "sudo -u multipass bash -c 'cp /home/multipass/*.launch /home/multipass/eclipse-workspace/.metadata/.plugins/org.eclipse.debug.core/.launches'" ]
  - [ sh, -c, "sudo -u multipass bash -c 'cp /home/multipass/org.eclipse.titan.designer.prefs /home/multipass/eclipse-workspace/.metadata/.plugins/org.eclipse.core.runtime/.settings'" ]  
  - [ sh, -c, "mkdir /opt/eclipse-backup" ]   
  - [ sh, -c, "chown multipass:multipass /opt/eclipse-backup" ]    
  - [ sh, -c, "sudo mv /home/multipass/eclipse.tar.gz /opt/eclipse-backup" ] 
  - [ sh, -c, "sudo mv /home/multipass/TITAN.zip /opt/eclipse-backup" ]  
  - [ sh, -c, "sudo mv /home/multipass/*.launch /opt/eclipse-backup" ]  
  - [ sh, -c, "sudo mv /home/multipass/org.eclipse.titan.designer.prefs /opt/eclipse-backup" ]    
  - [ sh, -c, "sudo -u multipass bash -c 'eclipse -nosplash -data /home/multipass/eclipse-workspace -initialize'" ]      
# ====================================================================================================================================================
#                          FIREFOX
# ====================================================================================================================================================
  - [ sh, -c, 'echo "deb http://ppa.launchpad.net/mozillateam/ppa/ubuntu $(lsb_release -cs) main" > /etc/apt/sources.list.d/mozillateam-ppa.list' ]
  - [ sh, -c, "apt-key adv --keyserver keyserver.ubuntu.com --recv-keys 0x0ab215679c571d1c8325275b9bdb3d89ce49ec21" ]
  - [ sh, -c, "apt update" ]
  - [ sh, -c, "apt install -y firefox-esr" ]
# ====================================================================================================================================================
#                          CHROME
# ====================================================================================================================================================
  - [ sh, -c, "mkdir -p /etc/apt/keyrings" ]
  - [ sh, -c, "curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | gpg --dearmor -o /etc/apt/keyrings/google-chrome.gpg" ]
  - [ sh, -c, 'echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | tee /etc/apt/sources.list.d/google-chrome.list' ]
  - [ sh, -c, "apt update" ]
  - [ sh, -c, "apt install -y google-chrome-stable" ]
# ====================================================================================================================================================
#                          JAVA
# ====================================================================================================================================================
#  - [ sh, -c, "/etc/profile.d/java.sh" ]  
  - [ sh, -c, "wget -4 -qO- https://packages.adoptium.net/artifactory/api/gpg/key/public | gpg --dearmor -o /usr/share/keyrings/adoptium.gpg" ]
  - [ sh, -c, 'echo "deb [signed-by=/usr/share/keyrings/adoptium.gpg] https://packages.adoptium.net/artifactory/deb $(lsb_release -cs) main" | tee /etc/apt/sources.list.d/adoptium.list' ]
  - [ sh, -c, "apt-get update" ]
  - [ sh, -c, "apt-get install -y temurin-11-jdk temurin-21-jdk" ]
  - [ sh, -c, 'wget -4 -O /home/multipass/maven.tar.gz "https://dlcdn.apache.org/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz"' ]
  - [ sh, -c, "tar -xf /home/multipass/maven.tar.gz -C /opt/" ]
  - [ sh, -c, "chown -R multipass:multipass /opt/apache-maven-3.9.11" ]  
  - [ sh, -c, "sudo rm -f /home/multipass/maven.tar.gz" ]
# ====================================================================================================================================================
#                          VISUAL CODE
# ====================================================================================================================================================
  - [ sh, -c, "sudo snap install code --classic"]
# ====================================================================================================================================================
#                          FASTFETCH
# ====================================================================================================================================================
  - [ sh, -c, 'wget -4 -O /home/multipass/fastfetch-linux-amd64.deb "https://github.com/fastfetch-cli/fastfetch/releases/latest/download/fastfetch-linux-amd64.deb"' ]
  - [ sh, -c, "apt-get install -y /home/multipass/fastfetch-linux-amd64.deb" ]
  - [ sh, -c, "rm -f /home/multipass/fastfetch-linux-amd64.deb"]  
# ====================================================================================================================================================
#                          BUILD TITAN FROM SOURCE  
#           TITAN 11.1.0 is not configured to compile with most recent Kernel
# ====================================================================================================================================================
  - [ sh, -c, "git clone https://gitlab.eclipse.org/eclipse/titan/titan.core.git /opt/titan.core" ]
  - [ sh, -c, "chown -R multipass:multipass /opt/titan.core" ]  
  - [ sh, -c, "sudo -u multipass bash -c 'mv /home/multipass/Makefile.personal /opt/titan.core/Makefile.personal'"]    
  - [ sh, -c, "sudo -u multipass bash -c 'cd /opt/titan.core && git fetch && git checkout 11.1.0 && git pull'" ]
  #- [ sh, -c, "sudo -u multipass bash -c 'cd /opt/titan.core && make -j$(nproc)'" ]
  #- [ sh, -c, "sudo -u multipass bash -c 'cd /opt/titan.core && make install'" ]
  #- [ sh, -c, "/etc/profile.d/titan-env.sh" ]  
