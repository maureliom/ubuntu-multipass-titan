              ipkg=$(echo "$p_trim" | sed 's/;.*//')
              [[ -n "${seen_imports[$ipkg]:-}" ]] && continue
              seen_imports[$ipkg]=1

              # --- ALLOWED LIST FILTER ---
              allowed=false
              for allowed_pkg in "${ALLOWED_IMPORTS[@]}"; do
                  [[ "$ipkg" == "$allowed_pkg" ]] && allowed=true && break
              done
              $allowed || continue

              version_match=$(echo "$p_trim" | grep -o 'version="[^\"]*"') || true
              irange=${version_match#version=\"}
              irange=${irange%\"}
