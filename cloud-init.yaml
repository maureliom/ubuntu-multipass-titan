  - [ sh, -c, "git clone https://gitlab.eclipse.org/eclipse/titan/titan.EclipsePlug-ins /opt/titan.EclipsePlug-ins" ]
  - [ sh, -c, "chown -R multipass:multipass /opt/titan.EclipsePlug-ins" ]    
