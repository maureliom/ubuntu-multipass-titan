write_files:
# ====================================================================================================================================================
#                          github/gitlab credentials (PASSWORD = personal token)
# ====================================================================================================================================================
#          {USER_INPUT} I.Ex.: this is a .netrc file
#=====================================================================================================================================================
#      #   !!! PASSWORD IS PERSONAL TOKEN, not github.com password!!!
#=====================================================================================================================================================
#  - path: /home/multipass/.netrc
#    owner: multipass:multipass
#    permissions: '0600'
#    defer: true 
#    content: |
#      machine 
#      login 
#      password 
  - path: /home/multipass/.xsession
    owner: multipass:multipass
    permissions: '0777'
    defer: true
    content: |
      #!/bin/bash
      export XDG_SESSION_TYPE=x11
      export GDMSESSION=ubuntu
      export DESKTOP_SESSION=ubuntu
      export GNOME_SHELL_SESSION_MODE=ubuntu
      export XDG_CURRENT_DESKTOP=ubuntu:GNOME    
  - path: /home/multipass/.bashrc
    owner: multipass:multipass
    permissions: '0777'
    defer: true
    content: |
      # Source all /etc/profile.d scripts for interactive non-login shells
      for file in /etc/profile.d/*.sh; do
          [ -r "$file" ] && . "$file"
      done
      # Load system-wide bashrc (for colors, aliases, completion)
      if [ -f /etc/bash.bashrc ]; then
          . /etc/bash.bashrc
      fi
      # Enable colors for ls
      if [ -x /usr/bin/dircolors ]; then
          eval "$(dircolors -b)"
      fi
      /home/multipass/.config/autostart/desktop-tweaks.sh

      # Ensure locale and keyboard from system defaults
      if [ -f /etc/default/locale ]; then
          . /etc/default/locale
          export LANG LANGUAGE LC_ALL
      fi
      if [ -f /etc/default/keyboard ]; then
          . /etc/default/keyboard
          setxkbmap "$XKBLAYOUT" "$XKBVARIANT" 2>/dev/null || true
      fi

      alias ls='ls --color=auto'
      # Only for interactive shells
      #if [[ $- == *i* ]]; then
      #    # Set a nice colored prompt
      #    PS1='\[\033[01;32m\]\u@\h\[\033[00m\]:\[\033[01;34m\]\w\[\033[00m\]\$ '
      #fi
      # Only for interactive shells
      if [[ $- == *i* ]]; then
          # check if terminal supports color
          if tput setaf 1 &> /dev/null; then
              color_prompt=yes
          else
              color_prompt=
          fi

          if [ "$color_prompt" = yes ]; then
              PS1='${debian_chroot:+($debian_chroot)}\[\033[01;32m\]\u@\h\[\033[00m\]:\[\033[01;34m\]\w\[\033[00m\]\$ '
          else
              PS1='${debian_chroot:+($debian_chroot)}\u@\h:\w\$ '
          fi
      fi      
  - path: /etc/netplan/99-hyperv-multipass.yaml
    owner: root:root
    permissions: '0644'
    content: |
      network:
        version: 2
        ethernets:
          eth3:
            match:
              macaddress: 52:54:00:4b:ab:cd
            set-name: eth3
            dhcp4: false
            addresses:
              - 192.168.138.102/24
            routes:
              - to: 0.0.0.0/0
                via: 192.168.138.1
            nameservers:
              addresses: [8.8.8.8, 1.1.1.1]     
  - path: /etc/netplan/100-vbox-multipass.yaml
    owner: root:root
    permissions: '0644'
    content: |
      network:
        version: 2
        ethernets:
          enp0s8:
            match:
              macaddress: 52:54:00:4b:ab:cd
            set-name: enp0s8
            dhcp4: false
            addresses:
              - 192.168.138.102/24
            routes:
              - to: 0.0.0.0/0
                via: 192.168.138.1
            nameservers:
              addresses: [8.8.8.8, 1.1.1.1]            
